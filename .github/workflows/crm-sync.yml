name: Refresh micro CRM
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Run follow-ups, find gigs from the saved profile, or both'
        type: choice
        options: [all, gigs, followups]
        default: all
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-sync.yml'
      - 'scripts/crm-sync.mjs'
      - 'scripts/opportunity-scout.mjs'
      - 'worker/ecosystem-core.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: micro-crm-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh follow-up digest
        env:
          CRM_COMMAND: ${{ inputs.command || 'all' }}
        run: node scripts/crm-sync.mjs
