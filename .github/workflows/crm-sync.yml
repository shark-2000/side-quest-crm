name: Refresh micro CRM
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Run follow-ups, find gigs from the saved profile, or both'
        type: choice
        options: [all, gigs, followups, firecrawl-test]
        default: all
      firecrawl:
        description: 'Also search public boards with Firecrawl (requires API key secret; consumes credits)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-sync.yml'
      - 'scripts/crm-sync.mjs'
      - 'scripts/opportunity-scout.mjs'
      - 'scripts/firecrawl-scout.mjs'
      - 'worker/ecosystem-core.js'
permissions:
  contents: read
  id-token: write
concurrency:
  group: micro-crm-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh follow-up digest
        if: inputs.command != 'firecrawl-test'
        env:
          CRM_COMMAND: ${{ inputs.command || 'all' }}
          FIRECRAWL_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.firecrawl || github.event_name == 'schedule' && vars.FIRECRAWL_ENABLED == 'true' }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRE_CRAWL_API || secrets.FIRECRAWL_API_KEY }}
        run: node scripts/crm-sync.mjs
      - name: Test Firecrawl connection without importing gigs
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'firecrawl-test'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRE_CRAWL_API || secrets.FIRECRAWL_API_KEY }}
        run: node scripts/firecrawl-smoke.mjs
